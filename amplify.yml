version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Tooling deps (playwright/xlsx) are devDeps; never pull browser binaries in CI.
        - export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
        - npm install -g pnpm@9
        - pnpm install
        # The site's data is a release: the processors run wherever `pnpm data:release`
        # runs (a laptop or the release-data workflow), their output is verified against
        # the committed oracles there, and the bundle is published to the public
        # dbie-common-site-data bucket. The build only downloads the current release,
        # checking every file against the release manifest. See docs/database.md.
        - pnpm data:pull
    build:
      commands:
        # Amplify exposes env vars at build time only; write the enni ones
        # into .env.production so the Next SSR runtime can read them too.
        - env | grep -E '^ENNI_' >> .env.production || true
        - pnpm build
    postBuild:
      commands:
        # The pulled JSON served its purpose at build time (pages pre-rendered from it, and
        # next.config.js baked the release version into a /data/* rewrite). Shipping it too
        # would push the deployable output past Amplify's 220 MB limit, so the browser fetches
        # /data/*.json from the release in the bucket instead.
        - rm -rf public/data
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
