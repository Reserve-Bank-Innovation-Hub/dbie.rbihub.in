version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Tooling deps (playwright/xlsx) are devDeps; never pull browser binaries in CI.
        - export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
        - npm install -g pnpm@9
        - pnpm install
        # The data payload is derived in-CI from the committed sources
        # (data/sdmx CSVs + data/publications xlsx): run all processors,
        # verify the outputs byte-exact against the committed oracles,
        # then copy into public/data for the app build. No S3 involved —
        # an environment serves exactly what its branch's processors
        # produce from its branch's data.
        - pnpm data:build
        - pnpm data:verify
        - pnpm data:sync
    build:
      commands:
        # Amplify exposes env vars at build time only; write the enni ones
        # into .env.production so the Next SSR runtime can read them too.
        - env | grep -E '^ENNI_' >> .env.production || true
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
